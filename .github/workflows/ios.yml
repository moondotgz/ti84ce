# Builds an unsigned iOS .ipa on every push/PR and attaches it to GitHub
# releases for v* tags. The IPA is unsigned: install it with a sideloading tool
# that re-signs it (AltStore, SideStore, Sideloadly, …) or sign it yourself.
name: iOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Rust core tests
        run: cargo test -p ti84-core -p ti84-ffi

      - name: Build Rust XCFramework
        run: ios/build-rust.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -project ios/Ti84.xcodeproj \
            -scheme Ti84 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Ti84.app Payload/
          zip -qry Ti84-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Ti84-unsigned-ipa
          path: Ti84-unsigned.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ti84-unsigned.ipa
