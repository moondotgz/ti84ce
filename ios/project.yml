# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Generate with: ./build-rust.sh && xcodegen generate
name: Ti84
options:
  bundleIdPrefix: dev.ti84ce
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Ti84:
    type: application
    platform: iOS
    sources:
      - Ti84
    dependencies:
      - framework: Ti84Core.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Ti84
        PRODUCT_BUNDLE_IDENTIFIER: dev.ti84ce.calculator
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "TI-84 CE-T"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # Show Documents/Python in the Files app so scripts can be shared.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  Ti84:
    build:
      targets:
        Ti84: all
    run:
      config: Debug
    archive:
      config: Release
